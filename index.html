<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta
      name="description"
      content="A calm, editorial interactive map of nature recovery across Dorset, England."
    />
    <title>Dorset Nature Map · Mapping nature recovery across Dorset</title>

    <!-- Warm editorial type: Fraunces (display) + Inter (UI) + IBM Plex Mono (micro-labels). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Paint the page parchment immediately, before any JS, to avoid a white flash. -->
    <style>
      html,
      body {
        margin: 0;
        background: #f3eee4;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="Map of nature recovery across Dorset"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
